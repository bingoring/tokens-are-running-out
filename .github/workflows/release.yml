name: Release

# A tag like v1.2.3 or v1.2.3-rc.1 builds the universal app, signs it with Developer ID, notarizes it and
# attaches it to a GitHub release. A stable tag also points the Homebrew cask at it. See "Releasing" in the
# README for the secrets.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # Forks have no signing secrets.
    if: github.repository == 'bingoring/tokens-are-running-out'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # CFBundleVersion is the commit count; the main check needs origin/main
          persist-credentials: false

      - name: Check the tag
        id: tag
        run: |
          # The whole tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N: numbers without leading
          # zeros, and nothing else (no space or newline, nothing before or after).
          bad() {
            echo "::error::Tag must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          }
          case "$TAG" in
            v*) ;;
            *) bad ;;
          esac
          version="${TAG#v}"
          case "$version" in
            *-rc.*) base="${version%%-rc.*}" rc="${version#*-rc.}" prerelease=true ;;
            *) base="$version" rc="" prerelease=false ;;
          esac
          case "$base" in
            "" | *[!0-9.]* | .* | *.) bad ;;
          esac
          IFS=.
          set -- $base # digits and dots only, split on the dots
          unset IFS
          [ $# -eq 3 ] || bad
          if [ "$prerelease" = true ]; then
            set -- "$@" "$rc"
          fi
          for part in "$@"; do
            case "$part" in
              "" | *[!0-9]* | 0?*) bad ;;
            esac
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: A stable release is a commit on main
        if: steps.tag.outputs.prerelease == 'false'
        run: |
          # Pre-releases may come from a PR branch to try the pipeline; a stable release only from main.
          commit=$(git rev-parse --verify "HEAD^{commit}")
          tagged=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if [ "$commit" != "$tagged" ]; then
            echo "::error::The checkout ($commit) is not the commit $TAG points at ($tagged)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::$TAG points at $commit, which is not on main. Stable releases are tagged on main."
            exit 1
          fi

      - name: Check that the secrets exist (names only)
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          required="DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID"
          if [ "$PRERELEASE" = false ]; then
            required="$required TAP_TOKEN"
          fi
          missing=""
          for name in $required; do
            if [ -z "$(printenv "$name")" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi
          # Formats only; the values are never printed.
          if ! printf '%s' "$NOTARY_KEY_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::NOTARY_KEY_ID must be the 10-character key ID of an App Store Connect team key"
            exit 1
          fi
          if ! printf '%s' "$NOTARY_ISSUER_ID" | grep -Eqi '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::NOTARY_ISSUER_ID must be the issuer ID (a UUID) shown above the team keys in App Store Connect"
            exit 1
          fi

      # The tagged commit passes the same checks as CI before anything is signed.
      - name: Build app and tests (warnings are errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Anti-goals in the source (no network, writes only the index, no real transcripts)
        run: python3 -I scripts/check-anti-goals.py

      - name: Build the universal app
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: scripts/build-app.sh --release "$VERSION"

      - name: No network symbols or frameworks in either slice, no entitlements
        run: scripts/check-binary.sh .build/apps/TokensAreRunningOut.app

      # The signing secrets are written to disk only now, after everything that runs the tagged code's build
      # and tests.
      - name: Import the Developer ID certificate into a temporary keychain
        id: signing
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          (umask 077 && printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12")
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          count=$(security find-identity -v -p codesigning "$keychain" | grep -c '"Developer ID Application: ' || true)
          if [ "$count" != 1 ]; then
            echo "::error::Expected one Developer ID Application identity in the certificate, found $count"
            exit 1
          fi
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / { print $2; exit }')
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Write the notary API key
        id: notary
        env:
          P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          key="$RUNNER_TEMP/notary-key.p8"
          (umask 077 && printf '%s' "$P8_BASE64" | base64 --decode > "$key")
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Sign, notarize, staple and package
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          NOTARY_KEY: ${{ steps.notary.outputs.key }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          scripts/release.sh --version "$VERSION" --identity "$IDENTITY" --keychain "$KEYCHAIN" \
            --notary-key "$NOTARY_KEY" --notary-key-id "$NOTARY_KEY_ID" --notary-issuer "$NOTARY_ISSUER_ID"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          asset=".build/dist/TokensAreRunningOut-$VERSION.zip"
          sha=$(cut -d ' ' -f 1 "$asset.sha256")
          set -- "$TAG" "$asset" "$asset.sha256" --verify-tag --title "$TAG" --generate-notes \
            --notes "SHA-256 of TokensAreRunningOut-$VERSION.zip: \`$sha\`"
          if [ "$PRERELEASE" = true ]; then
            set -- "$@" --prerelease
          fi
          # Fails if a release for this tag already exists; it is never replaced.
          gh release create "$@"

      - name: Point the Homebrew cask at this release
        if: steps.tag.outputs.prerelease == 'false'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          # Only moves the cask forward: a release older than the cask's version leaves it as it is.
          # If only this step fails, run the "Update Homebrew tap" workflow for this tag; it does not rebuild.
          scripts/update-tap.sh "$VERSION" "$(cut -d ' ' -f 1 ".build/dist/TokensAreRunningOut-$VERSION.zip.sha256")" --only-newer

      - name: Remove the keychain and keys
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/release.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/release.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"
