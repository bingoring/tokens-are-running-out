name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

      - name: No network APIs in the app (anti-goal)
        run: |
          if grep -rnE 'URLSession|import Network' Sources; then
            echo "Network APIs are not allowed in Sources/." >&2
            exit 1
          fi
