name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build app and tests (warnings are errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Tools Package.swift

      - name: Same report as the prototype on synthetic fixtures
        run: prototype/parity.sh

      - name: App bundle (xcodebuild compiles the String Catalog)
        run: scripts/build-app.sh --snapshots

      - name: Every string in the code is in the catalog with Korean
        run: python3 -I scripts/check-strings.py

      - name: Every screen state renders (synthetic data)
        run: |
          for language in en ko; do
            .build/apps/UISnapshots.app/Contents/MacOS/ui-snapshots "$RUNNER_TEMP/snapshots" -AppleLanguages "($language)"
          done

      - name: Keep the screenshots for review
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: ${{ runner.temp }}/snapshots

      - name: Release build is universal and signs with the hardened runtime (ad hoc, no secrets)
        run: |
          scripts/build-app.sh --release 0.0.0
          scripts/release.sh --version 0.0.0 --dry-run

      - name: Embedded price table is current
        run: |
          python3 -I scripts/embed-pricing.py
          git diff --exit-code Sources/RunningOutCore/PricingData.swift

      - name: No network APIs in the app (anti-goal)
        run: |
          if grep -rnE 'URLSession|NSURLConnection|CFNetwork|import Network|socket\(|contentsOf: *URL\(string' Sources; then
            echo "Network APIs are not allowed in Sources/." >&2
            exit 1
          fi

      - name: Transcripts are only read (rule R9)
        run: |
          if grep -rnE 'forWritingTo|forWritingAtPath|forUpdating|\.write\(to|createFile\(|removeItem\(|createDirectory\(|moveItem\(|copyItem\(|replaceItem|fopen\(|O_WRONLY|O_RDWR|O_CREAT' Sources \
              | grep -v 'Indexer.swift:.*database\(URL\|Folder\)'; then
            echo "Sources/ may only write the index database." >&2
            exit 1
          fi

      - name: No real transcripts or indexes committed
        run: |
          if git ls-files | grep -E '\.(jsonl|sqlite)$'; then
            echo "Real transcripts or index files must not be committed." >&2
            exit 1
          fi

      - name: No merge commits from the base (rebase only)
        if: github.event_name == 'pull_request'
        run: |
          merges=$(git log --merges --oneline "origin/${{ github.base_ref }}..HEAD^2" 2>/dev/null || true)
          if [ -n "$merges" ]; then
            echo "$merges"
            echo "Rebase on the base branch instead of merging it in." >&2
            exit 1
          fi
