name: Bug report
description: Something in the app looks wrong or does not work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please keep your work private. Do not paste conversation content, session titles, file paths from your projects or anything from `~/.claude`. Counts, percentages and dollar amounts are enough.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings, or run `brew info --cask tokens-are-running-out`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.5
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac
      options:
        - Apple silicon
        - Intel
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - Homebrew
        - Download from Releases
        - Built from source
    validations:
      required: true
